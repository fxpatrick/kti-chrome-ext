<!DOCTYPE html>
<html>
<head>
    <title>Clear Company Setup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            background: #2563EB;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        #status {
            margin-top: 20px;
            color: #059669;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Clear Company Setup Data</h1>
    <p>Click the button below to reset the company setup. This will allow you to see the setup screen again.</p>
    <button id="clearBtn">Clear Setup Data</button>
    <p id="status"></p>

    <script src="/dist/clear-setup.js"></script>
</body>
</html>
